# Dokploy: Create Compose service → point at this repo → compose path `docker-compose.yml`.
# Set Environment in Dokploy UI (writes `.env` next to compose). Do not commit secrets.
services:
  storageui:
    image: hahahumble/storageui:0.2.2
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
